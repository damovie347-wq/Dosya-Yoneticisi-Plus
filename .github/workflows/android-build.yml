name: Android APK Build (Dosya Yöneticisi + 3.6.7)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed APK (Android 5.0 - Android 15+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Release Signing Keystore
        run: |
          if [ ! -f app/personal-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/personal-release-key.jks \
              -alias filemanagerplus \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=PersonalUse, OU=Mobile, O=Personal, L=Istanbul, S=TR, C=TR"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'filemanagerplus' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Single Installable APK
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output-apk/Dosya_Yoneticisi_Plus_v3.6.7.apk \;
          ls -lh output-apk/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dosya-Yoneticisi-Plus-v3.6.7-APK
          path: output-apk/Dosya_Yoneticisi_Plus_v3.6.7.apk
          if-no-files-found: error
