name: Android APK Build (Dosya Yöneticisi +)

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Optimize Edilmiş APK Derle (Debug & İmzalı Release)
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Lisanslarını Onayla ve Platform 35 Kur
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          echo "Aktif sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 Kurulumu ve Önbellek
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kişisel İmza Anahtarı (Keystore) Oluştur
        run: |
          if [ ! -f app/personal-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/personal-release-key.jks \
              -alias filemanagerplus \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=Dosya Yoneticisi Plus, OU=Personal, O=AlphaInventorClone, L=Mersin, S=Mersin, C=TR"
          fi

      - name: İmzalı Release ve Debug APK Derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Derlenen APK Dosyalarını Topla ve Yeniden Adlandır
        run: |
          mkdir -p dist-apk
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$REL_APK" "dist-apk/Dosya_Yoneticisi_Plus_v3.6.7_Release_Signed.apk"
          cp "$DBG_APK" "dist-apk/Dosya_Yoneticisi_Plus_v3.6.7_Debug.apk"
          ls -lh dist-apk/

      - name: APK Dosyalarını GitHub Artifacts Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dosya-Yoneticisi-Plus-APK
          path: dist-apk/*.apk
          if-no-files-found: error
